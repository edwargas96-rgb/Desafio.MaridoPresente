<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12100e">
  <title>Desafio Marido Presente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="hud" id="hud" hidden>
      <div class="hud-row">
        <span class="hud-lvl" id="hudLvl">Nv 1 · Piloto automático</span>
        <span class="hud-stats"><b id="hudStreak" hidden>🔥 0</b><b id="hudXp">⚡ 0</b></span>
      </div>
      <div class="bar"><i id="hudBar"></i></div>
    </header>
    <main id="stage" aria-live="polite"></main>
  </div>
  <div class="toast" id="toast" role="status"></div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/games.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
